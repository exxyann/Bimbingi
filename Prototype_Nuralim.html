<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NURALIM — Cahaya Ilmu, Barokah Belajar (Prototype Demo)</title>
<meta name="description" content="Prototype marketplace guru mengaji & tutor privat akademik on-demand di Malang Raya. Mode simulasi, data demo.">
<style>
/* ============================================================
   NURALIM — Prototype (MODE SIMULASI · DATA DEMO)
   Palet: Emerald #047857 / #065F46 / #ECFDF5, Gold #C9A227 / #FBF3D9,
   Navy #0F2440, Surface #F8FAFC, Teks #1F2937 / #475569, Border #E2E8F0
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --emerald:#047857; --emerald-dark:#065F46; --emerald-light:#ECFDF5;
  --gold:#C9A227; --gold-dark:#A8861D; --gold-light:#FBF3D9;
  --navy:#0F2440; --navy-2:#16324F;
  --surface:#F8FAFC; --card:#FFFFFF;
  --text:#1F2937; --muted:#475569; --faint:#94A3B8;
  --border:#E2E8F0;
  --red:#B91C1C; --red-light:#FEF2F2;
  --blue:#1D4ED8; --blue-light:#EFF6FF;
  --amber:#B45309; --amber-light:#FFFBEB;
  --shadow:0 1px 2px rgba(15,36,64,.05),0 4px 14px rgba(15,36,64,.07);
  --shadow-lg:0 8px 30px rgba(15,36,64,.16);
  --r:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--surface);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--emerald)}
::selection{background:var(--emerald-light)}

/* ---------- Topbar (header) ---------- */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(15,36,64,.25)}
.topbar-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--emerald) 0%,var(--emerald-dark) 100%);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.logo-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo-name{font-weight:800;letter-spacing:.14em;font-size:15px}
.logo-name b{color:#E7C868;font-weight:800}
.logo-sub{font-size:10px;color:#B9C6D8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-demo{background:rgba(4,120,87,.16);color:#6EE7B7;border:1px solid rgba(110,231,183,.35);font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.bell{position:relative;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .15s}
.bell:hover{background:rgba(255,255,255,.16)}
.bell-dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--gold);color:#3B2F04;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--navy)}
.tabs{display:none;gap:2px;max-width:1100px;margin:0 auto;padding:0 10px 8px}
.tab{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:#B9C6D8;display:flex;align-items:center;gap:6px}
.tab.active{background:rgba(255,255,255,.12);color:#fff}

/* ---------- Layout umum ---------- */
.page{max-width:560px;margin:0 auto;padding:16px 16px 92px}
.page-wide{max-width:900px}
.pb-40{padding-bottom:40px}
.pg-title{font-size:19px;font-weight:800;letter-spacing:-.01em}
.pg-sub{color:var(--muted);font-size:13px;margin-top:2px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 10px}
.sec-head h3{font-size:15.5px;font-weight:800}
.see-all{font-size:12.5px;font-weight:600;color:var(--emerald)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.b{font-weight:700}
.center{text-align:center}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.divider{height:1px;background:var(--border);margin:14px 0}
.linklike{color:var(--emerald);font-weight:600;font-size:13px}
.money{color:var(--emerald-dark);font-weight:800}

/* ---------- Kartu ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:15px}
.card-t{font-size:14.5px;font-weight:800;margin-bottom:6px}
.card-sub{font-size:12.5px;color:var(--muted)}

/* ---------- Greeting & lokasi ---------- */
.greet{font-size:20px;font-weight:800;letter-spacing:-.01em}
.greet-sub{color:var(--muted);font-size:13px;margin-top:2px}
.loc-row{display:flex;gap:8px;margin-top:12px}
.loc-row .select{flex:1}

/* ---------- Kategori grid ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cat-cell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;text-align:center}
.cat-cell:active{transform:scale(.96)}
.cat-cell:hover{border-color:var(--emerald)}
.cat-ico{font-size:22px;line-height:1}
.cat-name{font-size:10px;font-weight:700;color:var(--muted);line-height:1.25}
@media(min-width:768px){.cat-grid{grid-template-columns:repeat(8,1fr)}.cat-ico{font-size:26px}.cat-name{font-size:11px}}

/* ---------- Chips & badges ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:#EEF2F7;color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.chip.green{background:var(--emerald-light);color:var(--emerald-dark);border-color:#A7F3D0}
.chip.gold{background:var(--gold-light);color:#7A6210;border-color:#EAD98F}
.chip.navy{background:#E8EDF4;color:var(--navy);border-color:#CBD7E6}
.chip.red{background:var(--red-light);color:var(--red);border-color:#FECACA}
.chip.blue{background:var(--blue-light);color:var(--blue);border-color:#BFDBFE}
.chip.amber{background:var(--amber-light);color:var(--amber);border-color:#FDE68A}
.badge-verify{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#C9A227,#E4C25C);color:#3B2F04;font-size:10px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;box-shadow:0 1px 4px rgba(201,162,39,.4)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-wait{background:var(--amber-light);color:var(--amber);border:1px solid #FDE68A}
.st-ok{background:var(--emerald-light);color:var(--emerald-dark);border:1px solid #A7F3D0}
.st-done{background:var(--blue-light);color:var(--blue);border:1px solid #BFDBFE}
.st-cancel{background:var(--red-light);color:var(--red);border:1px solid #FECACA}
.st-gray{background:#EEF2F7;color:var(--muted);border:1px solid var(--border)}

/* ---------- Bintang ---------- */
.stars{color:#D97706;font-size:12.5px;letter-spacing:1px;white-space:nowrap}
.stars .cnt{color:var(--faint);font-size:11px;letter-spacing:0;margin-left:3px}
.star-btn{font-size:30px;color:#CBD5E1;transition:transform .1s}
.star-btn.active{color:#F59E0B}
.star-btn:active{transform:scale(1.15)}

/* ---------- Kartu tutor ---------- */
.tutor-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.tc-top{display:flex;gap:11px;align-items:flex-start}
.avatar{width:46px;height:46px;border-radius:13px;background:var(--emerald-light);color:var(--emerald-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;border:1.5px solid #A7F3D0}
.avatar.gold{background:var(--gold-light);color:#7A6210;border-color:#EAD98F}
.avatar.navy{background:#E8EDF4;color:var(--navy);border-color:#CBD7E6}
.avatar.lg{width:64px;height:64px;font-size:22px;border-radius:18px}
.tc-info{min-width:0;flex:1}
.tc-name{font-weight:800;font-size:15px;line-height:1.25}
.tc-meta{font-size:12px;color:var(--muted);margin-top:2px}
.tc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:10px}
.price{font-weight:800;color:var(--emerald-dark);font-size:14.5px}
.price small{color:var(--faint);font-weight:600;font-size:10.5px}
.dist{font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- Banner akad ---------- */
.banner-akad{background:linear-gradient(135deg,var(--emerald-dark),var(--emerald));border-radius:var(--r);color:#fff;padding:15px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);cursor:pointer;border:none;width:100%;text-align:left}
.ba-ico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.ba-t{font-weight:800;font-size:14px}
.ba-s{font-size:11.5px;color:#C7F0DF;margin-top:2px}
.ba-arrow{margin-left:auto;font-size:18px;color:#C7F0DF}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;border:1px solid transparent;transition:filter .15s,transform .1s;background:#EEF2F7;color:var(--text)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--emerald);color:#fff;box-shadow:0 2px 8px rgba(4,120,87,.3)}
.btn.primary:hover:not(:disabled){background:var(--emerald-dark)}
.btn.gold{background:var(--gold);color:#3B2F04;box-shadow:0 2px 8px rgba(201,162,39,.35)}
.btn.ghost{background:#fff;border-color:var(--border);color:var(--text)}
.btn.ghost:hover:not(:disabled){border-color:var(--emerald);color:var(--emerald-dark)}
.btn.danger{background:var(--red-light);color:var(--red);border-color:#FECACA}
.btn.dark{background:var(--navy);color:#fff}
.btn.small{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.block{width:100%}
.row-btns{display:flex;gap:9px;margin-top:16px}
.row-btns .btn{flex:1}
.btn-mini{font-size:11.5px;font-weight:700;color:var(--emerald-dark);background:var(--emerald-light);padding:5px 10px;border-radius:8px;border:1px solid #A7F3D0}
.btn-mini.red{color:var(--red);background:var(--red-light);border-color:#FECACA}
.btn-mini.gray{color:var(--muted);background:#EEF2F7;border-color:var(--border)}

/* ---------- Form ---------- */
.field{margin-bottom:13px}
.label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.input,.select,.textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23475569' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(4,120,87,.12)}
.textarea{min-height:84px;resize:vertical}
.err{color:var(--red);font-size:12px;margin-top:4px;display:none}
.err.show{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--emerald)}
.seg{display:flex;background:#EEF2F7;border-radius:11px;padding:3px;gap:2px}
.seg-btn{flex:1;padding:8px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.seg-btn.active{background:#fff;color:var(--emerald-dark);box-shadow:0 1px 4px rgba(15,36,64,.12)}

/* ---------- Daftar / list ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow)}
.li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.li-title{font-weight:800;font-size:14px}
.li-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.li-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.empty{background:var(--card);border:1.5px dashed var(--border);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--faint);font-size:13px}
.empty .e-ico{font-size:32px;display:block;margin-bottom:8px}

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(15,36,64,.06)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--faint);font-size:10px;font-weight:700;position:relative}
.bn-ico{font-size:19px;line-height:1}
.bn-item.active{color:var(--emerald)}
.bn-item.active .bn-ico{transform:translateY(-1px)}
.bn-dot{position:absolute;top:5px;right:calc(50% - 16px);min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}

/* ---------- Dashboard layout (guru/admin/owner) ---------- */
.layout{display:block;max-width:1100px;margin:0 auto;min-height:calc(100vh - 58px)}
.sidebar{display:none}
.main{padding:16px 14px 90px;min-width:0}
.side-brand{display:flex;align-items:center;gap:9px;padding:16px 14px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:#B9C6D8;text-align:left;width:100%}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff}
.side-link.active{background:var(--emerald);color:#fff;box-shadow:0 2px 8px rgba(4,120,87,.4)}
.side-ico{font-size:16px;width:22px;text-align:center}
.side-foot{margin-top:auto;padding:12px 14px;font-size:10.5px;color:#7C8DA6;border-top:1px solid rgba(255,255,255,.08)}
.mtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex-shrink:0;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.09);color:#B9C6D8;font-size:12.5px;font-weight:700}
.mtab.active{background:var(--emerald);color:#fff}
@media(min-width:768px){
  .layout{display:grid;grid-template-columns:242px 1fr}
  .sidebar{display:flex;flex-direction:column;background:var(--navy);min-height:calc(100vh - 58px);position:sticky;top:58px;height:calc(100vh - 58px)}
  .main{padding:22px 26px 40px}
  .mtabs{display:none}
}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:768px){.kpi-grid.k3{grid-template-columns:repeat(3,1fr)}.kpi-grid.k4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px;box-shadow:var(--shadow)}
.kpi-ico{width:32px;height:32px;border-radius:9px;background:var(--emerald-light);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.kpi-ico.gold{background:var(--gold-light)}
.kpi-ico.navy{background:#E8EDF4}
.kpi-ico.red{background:var(--red-light)}
.kpi-num{font-size:18px;font-weight:800;letter-spacing:-.01em}
.kpi-lb{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}

/* ---------- Tabel ---------- */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--border);background:#FBFDFE;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tr:hover td{background:#F8FAFC}

/* ---------- Jadwal / slot ---------- */
.sched-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-col{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:8px 5px;min-height:96px}
.day-h{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted)}
.day-d{text-align:center;font-size:10px;color:var(--faint);margin-bottom:6px}
.day-col.today{border-color:var(--emerald);background:var(--emerald-light)}
.slots{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.slot{font-size:10px;font-weight:700;padding:3px 2px;border-radius:6px;text-align:center;background:#EEF2F7;color:var(--muted);border:1px solid transparent}
.slot.on{background:var(--emerald-light);color:var(--emerald-dark);border-color:#A7F3D0}
.slot.picked{background:var(--emerald);color:#fff;border-color:var(--emerald-dark)}
.slot.booked{background:var(--navy);color:#fff}
.slot.pend{background:var(--amber-light);color:var(--amber);border-color:#FDE68A}
.slot.off{opacity:.35}
.slot.pickable{cursor:pointer}
.slot.pickable:hover{border-color:var(--emerald)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)}
.legend .slot{display:inline-block;padding:2px 8px}

/* ---------- Pembayaran ---------- */
.pay-methods{display:flex;flex-direction:column;gap:9px}
.paym{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 13px;text-align:left;width:100%;transition:border-color .12s}
.paym.active{border-color:var(--emerald);background:var(--emerald-light)}
.paym-ico{width:38px;height:38px;border-radius:10px;background:#EEF2F7;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.paym.active .paym-ico{background:#fff}
.paym-t{font-weight:800;font-size:13.5px}
.paym-s{font-size:11px;color:var(--muted)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;background:#fff;border:1.5px dashed var(--border);border-radius:var(--r)}
.qr-box{width:196px;height:196px;padding:10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.va-box{background:var(--card);border:1.5px dashed var(--border);border-radius:var(--r);padding:18px;text-align:center}
.va-num{font-size:22px;font-weight:800;letter-spacing:.12em;color:var(--navy);font-variant-numeric:tabular-nums}
.progress{height:9px;background:#EEF2F7;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--emerald),#34D399);border-radius:999px;transition:width .25s ease}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(15,36,64,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease}

.modal{background:#fff;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px;animation:slideUp .22s ease}

.modal-b{margin-top:12px;font-size:13.5px;color:var(--muted)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(28px);opacity:.4}to{transform:translateY(0);opacity:1}}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:14px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow-lg);max-width:420px;animation:slideUp .25s ease;display:flex;gap:8px;align-items:center}
.toast.ok{background:var(--emerald-dark)}
.toast.err{background:var(--red)}

/* ---------- Akordion FAQ ---------- */
.acc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.acc + .acc{margin-top:8px}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;font-weight:700;font-size:13.5px;text-align:left}

.acc-h.active .acc-ico{transform:rotate(45deg)}
.acc-b{display:none;padding:0 15px 14px;font-size:13px;color:var(--muted)}
.acc-b.open{display:block}

function haversine(la1, lo1, la2, lo2){
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLa = toR(la2 - la1), dLo = toR(lo2 - lo1);
  const a = Math.sin(dLa/2)**2 + Math.cos(toR(la1)) * Math.cos(toR(la2)) * Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function hashStr(s){ let h = 7; s = String(s); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

/* Pseudo-QR deterministik (murni dekorasi untuk simulasi pembayaran) */
function qrSVG(seed){
  const N = 21; let h = hashStr(seed);
  const rnd = () => { h = (h * 1103515245 + 12345) >>> 0; return (h >> 8) / 16777216; };
  const g = [];
  for (let y = 0; y < N; y++){ g[y] = []; for (let x = 0; x < N; x++) g[y][x] = rnd() > 0.52 ? 1 : 0; }
  const finder = (ox, oy) => {
    for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++){
      const edge = x === 0 || x === 6 || y === 0 || y === 6;
      const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
      g[oy + y][ox + x] = (edge || core) ? 1 : 0;
    }
  };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  let r = '';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (g[y][x]) r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#0F2440" rx="0.18"/>';
  return '<svg viewBox="-1 -1 ' + (N + 2) + ' ' + (N + 2) + '" width="100%" height="100%" shape-rendering="crispEdges">' +
         '<rect x="-1" y="-1" width="' + (N + 2) + '" height="' + (N + 2) + '" fill="#fff"/>' + r + '</svg>';
}
function vaNumber(seed){ const h = hashStr(seed); return '8808 ' + pad(h % 100000000, 8).replace(/(\d{4})(\d{4})/, '$1 $2'); }

let DB = null;
function loadDB(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw){ DB = JSON.parse(raw); }
  } catch (e){ DB = null; }
  if (!DB || !DB.tutors || !DB.users){ DB = seedDB(); saveDB(); }
}
function saveDB(){ try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e){ /* storage penuh — abaikan (demo) */ } }
function resetDemo(){
  localStorage.removeItem(LS_KEY);
  DB = seedDB(); saveDB();
  state.f = defaultFilters();
  toast('Data demo berhasil di-reset ke kondisi awal.', 'ok');
  renderApp();
}
function currentUser(){ return (DB.users.find(u => u.id === localStorage.getItem(LS_SES))) || null; }
function setSession(uid){ localStorage.setItem(LS_SES, uid); }
function clearSession(){ localStorage.removeItem(LS_SES); }
function tutorOfUser(uid){ return DB.tutors.find(t => t.userId === uid) || null; }
function userById(id){ return DB.users.find(u => u.id === id) || null; }
function tutorById(id){ return DB.tutors.find(t => t.id === id) || null; }
function areaName(id){ const a = DB.areas.find(x => x.id === id); return a ? a.name : '—'; }

  if (fn){ e.preventDefault(); fn(el.dataset, el); return; }
  if (el.dataset.act === 'close-modal'){ closeModal(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form];
  if (fn) fn(f);
});

  const fn = CHANGES[el.dataset.change];
  if (fn) fn(el.dataset, el);
});

function doLogin(email, pass){
  const u = DB.users.find(x => x.email.toLowerCase() === String(email).toLowerCase().trim());
  if (!u || u.password !== pass){ return null; }
  DB.settings.logins = (DB.settings.logins || 0) + 1;
  setSession(u.id); saveDB();
  return u;
}

   ===================================================================== */
PAGES.search = function(){
  const u = currentUser();
  const f = state.f;
  let list = DB.tutors.map(t => ({ t, dist: distFromUser(t, u) }));
  // filter
  list = list.filter(x => {
    const t = x.t;
    if (f.cat && !(t.categories || []).includes(f.cat)) return false;
    if (x.dist > f.radius) return false;
    if (t.pricePerSession < f.min || t.pricePerSession > f.max) return false;
    if (t.rating < f.rate) return false;
    if (f.method && !(t.methods || []).includes(f.method)) return false;
    if (f.ver === 'ok'){ if (t.verification !== 'Active' && t.verification !== 'Verified') return false; }
    else if (f.ver === 'pending' && t.verification !== 'Pending Verification') return false;
    return true;
  });
  // sorting
  if (f.sort === 'jarak') list.sort((a, b) => a.dist - b.dist);
  else if (f.sort === 'rating') list.sort((a, b) => b.t.rating - a.t.rating || b.t.ratingCount - a.t.ratingCount);
  else if (f.sort === 'harga') list.sort((a, b) => a.t.pricePerSession - b.t.pricePerSession);

  return '<div class="pg-title">Cari Tutor</div><div class="pg-sub">Jarak dihitung dari ' + esc(areaName(u.areaId)) + ' (haversine, demo koordinat).</div>' +
    '<div class="card card-pad mt12"><div class="card-t">🔍 Filter</div>' +
    '<div class="row2">' +
      '<div class="field"><label class="label">Kategori</label><select class="select" data-change="f-cat">' +
        '<option value="">Semua kategori</option>' + DB.categories.map(c => '<option value="' + c.id + '" ' + (f.cat === c.id ? 'selected' : '') + '>' + c.icon + ' ' + esc(c.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label class="label">Radius dari saya</label><select class="select" data-change="f-radius">' +
        [1,3,5,10,20].map(r => '<option value="' + r + '" ' + (f.radius === r ? 'selected' : '') + '>≤ ' + r + ' km</option>').join('') + '</select></div>' +
    '</div>' +
    '<div class="row3">' +
      '<div class="field"><label class="label">Harga min</label><input class="input" type="number" id="f-min" value="' + f.min + '" min="0" step="5000" data-change="f-price"></div>' +
      '<div class="field"><label class="label">Harga max</label><input class="input" type="number" id="f-max" value="' + (f.max >= 200000 ? '' : f.max) + '" placeholder="200000" min="0" step="5000" data-change="f-price"></div>' +
      '<div class="field"><label class="label">Rating min</label><select class="select" data-change="f-rate">' +
        [[0,'Semua'],[4,'⭐ 4,0+'],[4.5,'⭐ 4,5+'],[4.8,'⭐ 4,8+']].map(r => '<option value="' + r[0] + '" ' + (f.rate === r[0] ? 'selected' : '') + '>' + r[1] + '</option>').join('') + '</select></div>' +
    '</div>' +
    '<div class="row3">' +
      '<div class="field"><label class="label">Metode</label><select class="select" data-change="f-method">' +
        '<option value="">Semua</option><option value="home" ' + (f.method === 'home' ? 'selected' : '') + '>🏠 Home</option><option value="online" ' + (f.method === 'online' ? 'selected' : '') + '>💻 Online</option></select></div>' +
      '<div class="field"><label class="label">Verifikasi</label><select class="select" data-change="f-ver">' +
        '<option value="ok" ' + (f.ver === 'ok' ? 'selected' : '') + '>Verified &amp; Active</option><option value="pending" ' + (f.ver === 'pending' ? 'selected' : '') + '>Pending (demo admin)</option><option value="all" ' + (f.ver === 'all' ? 'selected' : '') + '>Tampilkan semua</option></select></div>' +
      '<div class="field"><label class="label">Urutkan</label><select class="select" data-change="f-sort">' +

    '</div>';

ACTIONS['do-pay'] = function(d, el){
  const b = DB.bookings.find(x => x.id === d.id);
  if (!b || state.paying) return;
  state.paying = true;
  const bar = document.getElementById('pay-bar');
  const prog = document.getElementById('pay-progress');
  const btn = document.getElementById('pay-btn');
  if (btn) btn.disabled = true;
  if (prog) prog.style.display = 'block';
  toast('Memproses pembayaran simulasi…', 'info');
  let w = 0;
  const iv = setInterval(() => {
    w += 9 + Math.random() * 12;
    if (bar) bar.style.width = Math.min(100, w) + '%';
    if (w >= 100){
      clearInterval(iv);
      setTimeout(() => {
        // ==== sukses pembayaran (simulasi) ====
        b.status = 'Dikonfirmasi';
        const pay = DB.payments.find(p => p.bookingId === b.id);
        const payId = pay ? pay.id : nextId(DB.payments, 'PAY');
        if (pay){ pay.status = 'Ditahan (Amanah Wakalah)'; pay.method = state.payMethod; pay.amount = b.price; pay.paidAt = Date.now(); }
        else DB.payments.push({ id: payId, bookingId: b.id, method: state.payMethod, amount: b.price, status: 'Ditahan (Amanah Wakalah)', paidAt: Date.now() });
        const t = tutorById(b.tutorId);
        const u = currentUser();
        pushNotif(b.customerId, 'Pembayaran ' + b.id + ' sukses (simulasi). Dana ditahan sebagai amanah wakalah — dicairkan setelah sesi selesai.');
        if (t) pushNotif(t.userId, 'Booking ' + b.id + ' telah DIBAYAR (' + rp(b.price) + ') oleh ' + (u ? u.name : 'pelanggan') + '. Silakan terima permintaan di Dashboard. (demo)');
        saveDB();
        state.paying = false;
        toast('Pembayaran simulasi sukses! 🎉', 'ok');
        go('confirm', { id: b.id });
      }, 350);
    }
  }, 160);
};

ACTIONS['toggle-day'] = d => {
  const day = Number(d.day);
  const av = state.tAvail;
  const idx = av.findIndex(a => a.day === day);
  if (idx >= 0) av.splice(idx, 1);
  else av.push({ day, slots: ['16:00','19:00'] });
  renderApp();
};
ACTIONS['toggle-slot'] = d => {
  const day = Number(d.day), slot = d.slot;
  const av = state.tAvail;
  let cur = av.find(a => a.day === day);
  if (!cur){ cur = { day, slots: [] }; av.push(cur); }
  const i = cur.slots.indexOf(slot);
  if (i >= 0) cur.slots.splice(i, 1); else cur.slots.push(slot);
  if (!cur.slots.length){ const idx = av.findIndex(a => a.day === day); if (idx >= 0) av.splice(idx, 1); }
  renderApp();
};

function drawGmvChart(){
  const cv = document.getElementById('gmv-chart');
  if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const data = (DB.gmv || []).map(h => h.gmv);
  const labels = (DB.gmv || []).map(h => h.label);
  const max = Math.max.apply(null, data.concat([1])) * 1.15;
  ctx.clearRect(0, 0, W, H);
  // grid horizontal
  ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1;
  ctx.font = '11px -apple-system,Segoe UI,Arial';
  ctx.fillStyle = '#94A3B8';
  for (let i = 0; i <= 4; i++){
    const y = 30 + (H - 60) * i / 4;
    ctx.beginPath(); ctx.moveTo(56, y); ctx.lineTo(W - 12, y); ctx.stroke();
    ctx.fillText(juta(max * (1 - i / 4)), 6, y + 4);
  }
  // batang
  const n = data.length;
  const gap = 18, bw = (W - 80 - gap * (n - 1)) / n;
  data.forEach((v, i) => {
    const h = (H - 60) * (v / max);
    const x = 56 + i * (bw + gap);
    const y = 30 + (H - 60) - h;
    const grad = ctx.createLinearGradient(0, y, 0, y + h);
    const last = i === n - 1;
    grad.addColorStop(0, last ? '#E4C25C' : '#059669');
    grad.addColorStop(1, last ? '#C9A227' : '#065F46');
    ctx.fillStyle = grad;
    const r = 7;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + bw - r, y); ctx.arcTo(x + bw, y, x + bw, y + r, r);
    ctx.lineTo(x + bw, y + h); ctx.closePath(); ctx.fill();
    // label nilai
    ctx.fillStyle = '#1F2937'; ctx.font = 'bold 11px -apple-system,Segoe UI,Arial';
    ctx.textAlign = 'center';
    ctx.fillText(juta(v), x + bw / 2, y - 6);
    // label bulan
    ctx.fillStyle = '#475569'; ctx.font = '11px -apple-system,Segoe UI,Arial';
    ctx.fillText(labels[i] || '', x + bw / 2, H - 14);
    ctx.textAlign = 'start';
  });
}

/* =====================================================================
   23. RENDER APP (router utama) & INIT
   ===================================================================== */
function renderApp(){
  const app = document.getElementById('app');
  if (!app) return;
  let r = state.route;
  const pubRoutes = ['splash','onboard','login','register'];
  // halaman publik (tanpa shell)
  if (pubRoutes.indexOf(r) !== -1 && r !== 'splash'){
    app.innerHTML = PAGES[r] ? PAGES[r]() : '';
    if (AFTER[r]) AFTER[r]();
    return;
  }
  if (r === 'splash'){
    app.innerHTML = PAGES.splash ? PAGES.splash() : '';
    if (AFTER.splash) AFTER.splash();
    return;
  }
  const u = currentUser();
  if (!u){
    state.route = 'login';
    app.innerHTML = PAGES.login ? PAGES.login() : '';
    return;
  }
  // guard role: route tidak sesuai role → redirect ke default role
  state.route = guardRoles(r);
  const route = state.route;
  let content = '';
  try {
    content = PAGES[route] ? PAGES[route]() : emptyBox('🚧', 'Halaman belum tersedia (demo).');
  } catch (err){
    content = '<div class="empty"><span class="e-ico">⚠️</span>Terjadi kesalahan render: ' + esc(err && err.message ? err.message : err) + '</div>';
  }
  app.innerHTML = (u.role === 'customer') ? customerShell(content) : dashShell(content);
  if (AFTER[route]) AFTER[route]();
}

function init(){
  loadDB();
  // migrasi ringan bila struktur lama
  if (!DB.gmv) DB.gmv = seedDB().gmv;
  if (!DB.settings) DB.settings = { commission: 0.15, logins: 214 };
  if (typeof DB.settings.logins !== 'number') DB.settings.logins = 214;
  renderApp();
}
